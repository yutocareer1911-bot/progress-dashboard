name: サブタスク自動作成

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'   # 平日 9:00 JST（UTC 0:00）
    - cron: '0 10 * * 1-5'  # 平日 19:00 JST（UTC 10:00）

jobs:
  auto-subtasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: サブタスク自動作成
        run: node scripts/auto-create-subtasks.js
        env:
          MAGAZINE_LINEAR_API_KEY: ${{ secrets.MAGAZINE_LINEAR_API_KEY }}
          MAGAZINE_LINEAR_TEAM_KEY: ${{ secrets.MAGAZINE_LINEAR_TEAM_KEY }}
